name: Build macOS

# Compile Laser Studio Pro en .app/.dmg pour macOS, un job par
# architecture (pas d'universal2 — voir LaserStudioPro.spec).
#
# Déclenché :
# - sur un tag "v*" : build + publication en release (comme avant) ;
# - sur une Pull Request vers main qui touche du code Python ou les
#   fichiers macOS : build de validation (sans release), pour détecter
#   immédiatement sur la PR une dépendance ou un import cassé côté
#   macOS (ex. nouvelle lib ajoutée à requirements-windows.txt sans
#   l'ajouter à macos/requirements-macos.txt), au lieu de le découvrir
#   seulement à la prochaine sortie de version ;
# - manuellement (build + artefact seulement, sans release).
on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - "**.py"
      - "macos/**"
      - "requirements-*.txt"
      - ".github/workflows/macos-build.yml"
  workflow_dispatch: {}

# Nécessaire pour que l'étape "Publier en release" (softprops/action-gh-release)
# puisse créer/mettre à jour une release avec le token par défaut du workflow —
# sans ça, GitHub renvoie 403 "Resource not accessible by integration" à la
# création de la release, même si le job de compilation lui-même réussit.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (arm64). macos-14 est en cours de dépréciation
          # (fin de support prévue le 2 novembre 2026) : on cible macos-15.
          - runner: macos-15
            arch: arm64
          # Intel (x86_64). macos-13 est retiré ; macos-15-intel est le
          # dernier label x86_64 disponible pour Actions (jusqu'à fin
          # 2027 environ, cf. dépréciation Intel sur macOS annoncée par
          # GitHub). À revérifier si ce workflow est encore utilisé après
          # 2027.
          - runner: macos-15-intel
            arch: x86_64

    runs-on: ${{ matrix.runner }}
    name: build (${{ matrix.arch }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: macos/requirements-macos.txt

      - name: Vérifier l'architecture du runner
        run: |
          echo "Architecture réelle : $(uname -m)"
          uname -m | grep -q "${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r macos/requirements-macos.txt
          pip install pyinstaller

      - name: Générer l'icône .icns
        run: |
          ICONSET_DIR="$(mktemp -d)/laser_studio_pro.iconset"
          mkdir -p "$ICONSET_DIR"
          for size in 16 32 64 128 256 512; do
            sips -z "$size" "$size" laser_studio_pro_512.png --out "${ICONSET_DIR}/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" laser_studio_pro_512.png --out "${ICONSET_DIR}/icon_${size}x${size}@2x.png" >/dev/null
          done
          sips -z 1024 1024 laser_studio_pro_512.png --out "${ICONSET_DIR}/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$ICONSET_DIR" -o macos/laser_studio_pro.icns

      - name: Compiler avec PyInstaller
        run: pyinstaller --noconfirm macos/LaserStudioPro.spec

      - name: Vérifier syntaxe (py_compile)
        run: python -m py_compile *.py

      - name: Créer le .dmg
        run: |
          APP_NAME="LaserStudioPro"
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${{ github.ref_type }}" != "tag" ]; then
            VERSION="dev"
          fi
          DMG_NAME="${APP_NAME}_${VERSION}_macos_${{ matrix.arch }}.dmg"
          echo "DMG_NAME=${DMG_NAME}" >> "$GITHUB_ENV"
          hdiutil create -volname "${APP_NAME}" -srcfolder "dist/${APP_NAME}.app" \
            -ov -format UDZO "dist/${DMG_NAME}"

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: LaserStudioPro-macos-${{ matrix.arch }}
          path: dist/${{ env.DMG_NAME }}
          retention-days: 30

      - name: Publier en release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.DMG_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
