name: Release

# Compile Laser Studio Pro pour Linux (AppImage), Windows (installeur) et
# macOS (.dmg arm64 et x86_64), puis crée la release GitHub en BROUILLON avec
# tous les fichiers : un mainteneur la relit et clique sur « Publier ».
#
# Déclenché :
# - sur un tag "v*" (ex. v2.6.0) : tests, compilations, release en brouillon.
#   Le tag doit correspondre à APP_VERSION (src/laser_studio/core/version.py),
#   sinon les compilations s'arrêtent ;
# - manuellement : tests et compilations, fichiers en artefacts seulement
#   (version « X.Y.Z-dev »), sans release.
#
# Notes de la release : RELEASE_NOTES_<version>.md s'il existe, sinon les
# notes générées par GitHub (MR fusionnées depuis le tag précédent).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  linux:
    needs: tests
    runs-on: ubuntu-22.04   # glibc 2.35 : l'AppImage tourne sur Ubuntu 22.04+, Debian 12, Fedora récentes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version
        shell: bash
        run: |
          APP=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' src/laser_studio/core/version.py)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            [ "$VERSION" = "$APP" ] || { echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à APP_VERSION ($APP)"; exit 1; }
          else
            VERSION="$APP-dev"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-linux.txt

      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
            libdbus-1-3 libglib2.0-0 libnss3 libnspr4 libasound2 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 \
            libxshmfence1 libgbm1 libdrm2 libxcb-cursor0 xvfb

      - name: Dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-linux.txt pyinstaller

      - name: Compiler (PyInstaller, dossier)
        run: packaging/linux/build-linux.sh --onedir

      - name: AppImage
        run: packaging/linux/build-appimage.sh "$VERSION"

      # L'application doit démarrer et rester ouverte : `timeout` l'arrête au
      # bout de 30 s (code 124). Tout autre code = plantage au démarrage.
      # NOWARNING : pas d'avertissement de sécurité modal, la fenêtre
      # principale se charge vraiment.
      - name: Vérifier que l'AppImage démarre
        env:
          NOWARNING: "1"
        run: |
          set +e
          xvfb-run -a timeout 30 "dist/LaserStudioPro-$VERSION-x86_64.AppImage" --appimage-extract-and-run
          code=$?
          echo "Code de sortie : $code"
          [ "$code" -eq 124 ]

      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: LaserStudioPro-linux
          path: dist/LaserStudioPro-${{ env.VERSION }}-x86_64.AppImage
          retention-days: 30

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version
        shell: bash
        run: |
          APP=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' src/laser_studio/core/version.py)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            [ "$VERSION" = "$APP" ] || { echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à APP_VERSION ($APP)"; exit 1; }
          else
            VERSION="$APP-dev"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-windows.txt

      - name: Dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt pyinstaller

      - name: Compiler (PyInstaller, dossier)
        shell: cmd
        run: packaging\windows\build.bat --ci

      - name: Installer Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Installeur
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=%VERSION% packaging\windows\setup.iss
          move Setup-LSP\LaserStudioPro_Setup.exe "dist\LaserStudioPro_Setup-%VERSION%-Windows.exe"

      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: LaserStudioPro-windows
          path: dist/LaserStudioPro_Setup-${{ env.VERSION }}-Windows.exe
          retention-days: 30

  macos:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (arm64), puis Intel (x86_64) : voir macos-build.yml
          # pour le choix des machines.
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    name: macos (${{ matrix.arch }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version
        shell: bash
        run: |
          APP=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' src/laser_studio/core/version.py)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            [ "$VERSION" = "$APP" ] || { echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à APP_VERSION ($APP)"; exit 1; }
          else
            VERSION="$APP-dev"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: packaging/macos/requirements-macos.txt

      - name: Dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/macos/requirements-macos.txt
          pip install pyinstaller

      - name: Générer l'icône .icns
        run: |
          ICONSET_DIR="$(mktemp -d)/laser_studio_pro.iconset"
          mkdir -p "$ICONSET_DIR"
          for size in 16 32 64 128 256 512; do
            sips -z "$size" "$size" src/laser_studio/resources/laser_studio_pro_512.png --out "${ICONSET_DIR}/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" src/laser_studio/resources/laser_studio_pro_512.png --out "${ICONSET_DIR}/icon_${size}x${size}@2x.png" >/dev/null
          done
          sips -z 1024 1024 src/laser_studio/resources/laser_studio_pro_512.png --out "${ICONSET_DIR}/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$ICONSET_DIR" -o packaging/macos/laser_studio_pro.icns

      - name: Compiler avec PyInstaller
        run: pyinstaller --noconfirm packaging/macos/LaserStudioPro.spec

      - name: Créer le .dmg
        run: |
          DMG_NAME="LaserStudioPro_${VERSION}_macos_${{ matrix.arch }}.dmg"
          echo "DMG_NAME=${DMG_NAME}" >> "$GITHUB_ENV"
          hdiutil create -volname "LaserStudioPro" -srcfolder "dist/LaserStudioPro.app" \
            -ov -format UDZO "dist/${DMG_NAME}"

      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: LaserStudioPro-macos-${{ matrix.arch }}
          path: dist/${{ env.DMG_NAME }}
          retention-days: 30

  release:
    if: github.ref_type == 'tag'
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # créer la release et y déposer les fichiers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fichiers compilés
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Notes de version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -f "RELEASE_NOTES_${VERSION}.md" ]; then
            echo "NOTES=RELEASE_NOTES_${VERSION}.md" >> "$GITHUB_ENV"
          fi
          ls -lh assets

      - name: Release en brouillon
        uses: softprops/action-gh-release@v2
        with:
          name: Laser Studio Pro ${{ github.ref_name }}
          draft: true
          files: assets/*
          body_path: ${{ env.NOTES }}
          generate_release_notes: ${{ env.NOTES == '' }}
