name: Tests

# Suite de tests (unittest), sans écran (QT_QPA_PLATFORM=offscreen).
#
# Déclenchée :
# - sur chaque Pull Request vers Dev ou main, et chaque push sur ces branches ;
# - par le workflow Release, avant de compiler (workflow_call) ;
# - manuellement.
on:
  push:
    branches: [Dev, main]
  pull_request:
    branches: [Dev, main]
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-linux.txt

      # Bibliothèques dont Qt (et QtWebEngine, chargé par Stencil Studio) a
      # besoin, même sans écran.
      - name: Dépendances système de Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
            libdbus-1-3 libglib2.0-0 libnss3 libnspr4 libasound2 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 \
            libxshmfence1 libgbm1 libdrm2 libxcb-cursor0

      - name: Dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-linux.txt

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests
