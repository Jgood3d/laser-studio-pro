[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "laser-studio-pro"
dynamic = ["version"]
description = "Préparation et pilotage de gravures laser GRBL"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
# Versions exactes des builds : requirements_principal.txt.
dependencies = [
    "numpy",
    "opencv-python-headless",
    "pillow",
    "PyQt6",
    "PyQt6-WebEngine",
    "pyqtgraph",
    "pyserial",
    "scikit-image",
    "scipy",
    "svg.path",
]

[project.gui-scripts]
laser-studio-pro = "laser_studio.main:main"

[tool.setuptools.dynamic]
version = {attr = "laser_studio.core.version.APP_VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
laser_studio = ["resources/**/*"]
# Stencil Studio : page de l'interface, traductions, police, modèle de détourage.
stencil_studio = ["ui/studio.html", "locales/*.json", "resources/fonts/*.ttf", "resources/models/*.onnx"]

# Analyse statique lancée par la CI (job « checks » de .github/workflows/tests.yml) :
# erreurs réelles seulement (pyflakes F et erreurs de syntaxe E9), pas de style imposé.
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# Variables de calcul conservées volontairement dans le cœur de Stencil Studio (zone en cours de travail).
"src/stencil_studio/core.py" = ["F841"]
"src/stencil_studio/lightbox.py" = ["F841"]
